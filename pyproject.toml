[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-carrier-automation"
version = "0.1.0"
description = "Inbound carrier sales automation for the HappyRobot FDE technical challenge"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]